name: iOS Screenshots

on:
  workflow_dispatch: {}

jobs:
  screenshots:
    runs-on: macos-26
    defaults:
      run:
        working-directory: masterchas_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.0.app
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Pick and boot simulator
        run: |
          DEVICE_LINE=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9] Pro Max" | tail -1)
          if [ -z "$DEVICE_LINE" ]; then
            DEVICE_LINE=$(xcrun simctl list devices available | grep -E "iPhone" | tail -1)
          fi
          UDID=$(echo "$DEVICE_LINE" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          NAME=$(echo "$DEVICE_LINE" | sed -E 's/\(.*//' | xargs)
          echo "Using device: $NAME ($UDID)"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Grant privacy permissions
        run: |
          xcrun simctl privacy "$UDID" grant all tj.masterchas.masterchasApp || true

      - name: Build for simulator
        run: flutter build ios --simulator --debug

      - name: Install and launch app
        run: |
          APP_PATH=$(find build/ios/iphonesimulator -maxdepth 1 -iname '*.app' | head -1)
          echo "App path: $APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" tj.masterchas.masterchasApp

      - name: Capture screenshots
        run: |
          mkdir -p screenshots
          sleep 4
          xcrun simctl io "$UDID" screenshot screenshots/01-splash.png
          sleep 5
          xcrun simctl io "$UDID" screenshot screenshots/02-home.png
          sleep 6
          xcrun simctl io "$UDID" screenshot screenshots/03-home-loaded.png
          sleep 8
          xcrun simctl io "$UDID" screenshot screenshots/04-later.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: masterchas-screenshots
          path: masterchas_app/screenshots/*.png
          retention-days: 14

